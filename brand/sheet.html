<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&family=Big+Shoulders+Display:wght@800&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}body{width:1600px;background:#d9d4ca;font-family:"Hanken Grotesk";padding:40px;display:grid;grid-template-columns:1fr 1fr;gap:28px}
.p{height:360px;display:grid;place-items:center;position:relative}.p small{position:absolute;left:20px;top:16px;font:600 12px "JetBrains Mono";letter-spacing:.08em;text-transform:uppercase;opacity:.55}
.light{background:#eeeae2;color:#141311}.dark{background:#0f0e0d;color:#eeeae2}.ember{background:#e2531c;color:#141311}
.lock{display:flex;align-items:center;gap:20px}.lock svg{width:84px;height:84px}.rule{width:1px;height:64px;background:currentColor;opacity:.28}
.w b{display:block;font:700 40px/1 "Hanken Grotesk";letter-spacing:.2em}.w i{display:block;font:500 13px/1 "JetBrains Mono";font-style:normal;letter-spacing:.32em;opacity:.6;margin-top:12px}
.icon{width:220px;height:220px}.coin{width:270px;height:270px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2a2825,#0f0e0d 70%);display:grid;place-items:center;box-shadow:inset 0 0 0 6px #e2531c, inset 0 0 0 12px #0f0e0d, inset 0 0 0 13px rgba(238,234,226,.35)}
.coin svg{width:130px;height:130px}.coin span{position:absolute;bottom:62px;font:600 13px "JetBrains Mono";letter-spacing:.3em;color:#eeeae2}
</style></head><body><svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="m" viewBox="0 0 32 32"><rect width="32" height="32" rx="5" fill="#141311"/><g fill="#eeeae2"><rect x="6" y="6" width="6" height="6" rx=".6"/><rect x="13" y="6" width="6" height="6" rx=".6"/><rect x="20" y="6" width="6" height="6" rx=".6"/><rect x="6" y="13" width="6" height="6" rx=".6"/><rect x="6" y="20" width="6" height="6" rx=".6"/><rect x="13" y="20" width="6" height="6" rx=".6"/><rect x="20" y="20" width="6" height="6" rx=".6"/></g><rect x="13" y="13" width="6" height="6" rx=".6" fill="#e2531c"/></symbol><symbol id="mi" viewBox="0 0 32 32"><rect width="32" height="32" rx="5" fill="#eeeae2"/><g fill="#141311"><rect x="6" y="6" width="6" height="6" rx=".6"/><rect x="13" y="6" width="6" height="6" rx=".6"/><rect x="20" y="6" width="6" height="6" rx=".6"/><rect x="6" y="13" width="6" height="6" rx=".6"/><rect x="6" y="20" width="6" height="6" rx=".6"/><rect x="13" y="20" width="6" height="6" rx=".6"/><rect x="20" y="20" width="6" height="6" rx=".6"/></g><rect x="13" y="13" width="6" height="6" rx=".6" fill="#e2531c"/></symbol></svg>
<div class="p light"><small>Primary lockup · light</small><div class="lock"><svg viewBox="0 0 32 32"><use href="#m"/></svg><span class="rule"></span><div class="w"><b>CONSILIUM</b><i>AGENT DESK</i></div></div></div>
<div class="p dark"><small>Primary lockup · dark</small><div class="lock"><svg viewBox="0 0 32 32"><use href="#mi"/></svg><span class="rule"></span><div class="w"><b>CONSILIUM</b><i>AGENT DESK</i></div></div></div>
<div class="p ember"><small>App icon</small><svg class="icon" viewBox="0 0 32 32"><use href="#m"/></svg></div>
<div class="p dark" style="position:relative"><small>$CONSIL token</small><div class="coin"><svg viewBox="0 0 32 32"><use href="#m"/></svg></div><span style="position:absolute;bottom:22px;font:600 13px 'JetBrains Mono';letter-spacing:.3em;color:#eeeae2">$CONSIL</span></div>
</body></html>
